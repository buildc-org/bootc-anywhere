[package]
name = "installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Installs a bootc image onto a disk from the media that carries it"

[features]
fuzzing = ["dep:tempfile"]

[[bin]]
name = "bootc-anywhere"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
tempfile = { version = "3.27.0", optional = true }
common = { git = "https://github.com/buildc-org/common", rev = "7956131e0c3ae5c6d4dadd187659240e44be7527" }

[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "warn"
dbg_macro = "deny"
excessive_nesting = "warn"
todo = "deny"
too_many_lines = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[lints.rust]
unreachable_pub = "warn"

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
clap-markdown = "0.1.5"
common = { git = "https://github.com/buildc-org/common", rev = "7956131e0c3ae5c6d4dadd187659240e44be7527", features = ["test-support"] }
insta = { version = "1.49.0", default-features = false }
