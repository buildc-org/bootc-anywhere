[package]
name = "installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Installs a bootc image onto a disk from the media that carries it"

[[bin]]
name = "bootc-anywhere"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2"
common = { git = "https://github.com/buildc-org/common", rev = "36135b1b167285d499efe3f092b8def2b0d07f59" }

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[dev-dependencies]
clap-markdown = "0.1.5"
common = { git = "https://github.com/buildc-org/common", rev = "36135b1b167285d499efe3f092b8def2b0d07f59", features = ["test-support"] }
insta = { version = "1.49.0", default-features = false }
