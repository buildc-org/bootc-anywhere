[package]
name = "installer"
version = "0.1.0"
edition = "2021"
publish = false
description = "Installs a bootc image onto a disk from the media that carries it"

[[bin]]
name = "bootc-anywhere"
path = "src/main.rs"

[dependencies]
libc = "0.2"
common = { git = "https://github.com/buildc-org/common", rev = "49dec6cbd939993ba35976c1ba145402eaeb5733" }

[profile.release]
opt-level = 1
debug = false
lto = false
codegen-units = 16
strip = true

[profile.dist]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
